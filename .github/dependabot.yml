# Weekly dependency updates, grouped to keep the number of pull requests small.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies]
    groups:
      # Patch and minor updates in one PR; majors each get their own.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the oldest supported Node (`engines`), not the newest release.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: [/apps/server, /apps/web]
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    ignore:
      # Node majors are picked by hand, LTS lines only.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    ignore:
      # A PostgreSQL major needs a data migration (dump/restore or pg_upgrade): done by hand.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
