    if (open) { p.innerHTML = NotifPanel(store.state); p.hidden = false; $('#notif-btn').setAttribute('aria-expanded', 'true'); }
  },
  'notif-seen': () => { store.update((s) => attentionItems(s).forEach((i) => s.ui.notifSeen.add(i.key))); closePopovers(); },
  'search-open': () => { $('#topbar').classList.add('search-open'); $('#search').focus(); },
  'search-close': () => searchClose(),
  'mock': (el) => toast(el.dataset.msg),
};
function searchClose() { $('#topbar').classList.remove('search-open'); const i = $('#search'); i.value = ''; renderSearchResults(''); }

function wireEvents() {
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-action]');
    if (!ev.target.closest('.notif-wrap') && !ev.target.closest('.search')) closePopovers();
    if (!el) return;
    const h = HANDLERS[el.dataset.action];
    if (h && el.tagName !== 'SELECT' && !(el.tagName === 'INPUT')) h(el, ev);
  });
  document.addEventListener('change', (ev) => {
    const el = ev.target;
    const a = el.dataset.action;
    if (a === 'rem-toggle') actions.toggleReminder(el.dataset.id);
    if (a === 'rem-showdone') actions.setUi({ remShowDone: el.checked });
    if (a === 'gh-sort') actions.setUi({ ghSort: el.value });
    if (a === 'gantt-project') { ganttScrollToday = true; actions.setUi({ ganttProject: el.value }); }
    if (a === 'gantt-zoom') { ganttScrollToday = true; actions.setUi({ ganttZoom: el.value }); }
  });
  document.addEventListener('submit', (ev) => {
    const f = ev.target;
    if (f.dataset.form !== 'rem-add') return;
    ev.preventDefault();
    const title = f.title.value.trim();
    if (!title) return;
    actions.addReminder(title, f.when.value);
    const input = $('#rem-new'); if (input) input.focus();
  });
  const search = $('#search');
  search.addEventListener('input', () => renderSearchResults(search.value));
  search.addEventListener('focus', () => { if (search.value) renderSearchResults(search.value); });
  search.addEventListener('keydown', (ev) => {
    const items = $$('#search-results .pop-item');
    const i = items.findIndex((x) => x.classList.contains('is-active'));
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault(); if (!items.length) return;
      const next = ev.key === 'ArrowDown' ? (i + 1) % items.length : (i - 1 + items.length) % items.length;
      items.forEach((x) => x.classList.remove('is-active')); items[next].classList.add('is-active'); items[next].scrollIntoView({ block: 'nearest' });
    }
    if (ev.key === 'Enter' && items[i]) { ev.preventDefault(); items[i].click(); }
    if (ev.key === 'Escape') { searchClose(); search.blur(); }
  });
  document.addEventListener('keydown', (ev) => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (ev.key === 'Escape') { if (store.state.ui.drawer) actions.closeDrawer(); closePopovers(); }
    if (!typing && (ev.key === '/' || ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k'))) {
      ev.preventDefault(); $('#topbar').classList.add('search-open'); search.focus();
    }
    if (ev.key === 'Tab' && store.state.ui.drawer) {
      const f = $$('#drawer button, #drawer [href], #drawer input, #drawer select').filter((x) => !x.disabled && x.offsetParent !== null);
      if (!f.length) return;
      if (ev.shiftKey && document.activeElement === f[0]) { ev.preventDefault(); f[f.length - 1].focus(); }
      else if (!ev.shiftKey && document.activeElement === f[f.length - 1]) { ev.preventDefault(); f[0].focus(); }
    }
  });
  document.addEventListener('mouseover', (ev) => { const el = ev.target.closest('[data-tip],[data-tip-rail]'); if (el) showTip(el); else hideTip(); });
  document.addEventListener('focusin', (ev) => { const el = ev.target.closest && ev.target.closest('[data-tip],[data-tip-rail]'); if (el && ev.target.matches(':focus-visible')) showTip(el); else hideTip(); });
  window.addEventListener('scroll', hideTip, { passive: true });
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => render(store.state));
}

/* boot */
async function boot() {
  $$('[data-slot="logo"]').forEach((el) => { el.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${ICONS.logo}</svg>`; });
  $$('[data-slot="icon-search"]').forEach((el) => { el.innerHTML = icon('search'); });
  $$('[data-slot="icon-bell"]').forEach((el) => { el.innerHTML = icon('bell'); });
  $$('[data-slot="icon-x"]').forEach((el) => { el.innerHTML = icon('x', 'sm'); });
  const [emails, events, pulls, issues, reminders, trello, projects, gantt] = await Promise.all([
    dataSource.getEmails(), dataSource.getEvents(), dataSource.getPullRequests(), dataSource.getIssues(),
    dataSource.getReminders(), dataSource.getTasks(), dataSource.getProjects(), dataSource.getGanttFor(CONFIG.user.name),
  ]);
  store.subscribe(render);
  wireEvents();
  store.set({ emails, events, pulls, issues, reminders, trello, projects, gantt, ui: initialUi() });
  initScrollSpy();
  setInterval(() => { if (!document.hidden && !store.state.ui.drawer) render(store.state); }, CONFIG.refreshMs);
}
boot();
</script>
</body>
